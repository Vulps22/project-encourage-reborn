name: Database Service — Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: vulps23/project-encourage-ds:latest

  rollout:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure npm for private packages
        run: npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Open SSH tunnel to VPS database
        run: |
          ssh -i ~/.ssh/id_rsa -fN -L ${{ secrets.DB_PORT }}:localhost:${{ secrets.DB_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          sleep 2

      - name: Run database migrations
        env:
          DB_HOST: localhost
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: npm run db:rollout

      - name: Close SSH tunnel
        if: always()
        run: pkill -f "ssh.*-L ${{ secrets.DB_PORT }}:localhost:${{ secrets.DB_PORT }}" || true

      - name: Commit applied migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/migrations/applied/
          if git diff --staged --quiet; then
            echo "No migration files moved"
          else
            git commit -m "ci: mark applied migrations post-rollout"
            git push origin main
          fi

      - name: Merge current-release into main
        run: |
          git fetch origin
          if git ls-remote --exit-code origin current-release; then
            git checkout -b main origin/main
            git merge origin/current-release --no-edit
            git push origin main
          else
            echo "No current-release branch yet — skipping merge"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: rollout
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/discord-bots/project-encourage &&
            docker compose pull ds &&
            docker compose up -d ds
          "
