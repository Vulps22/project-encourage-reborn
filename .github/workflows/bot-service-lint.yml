name: Bot Service — Lint

on:
  push:
    branches: [main]
    paths:
      - 'bot-service/src/**/*.ts'
      - 'bot-service/eslint.config.mjs'
      - 'bot-service/.eslintrc.json'
      - 'bot-service/tsconfig.json'
      - 'bot-service/package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'bot-service/src/**/*.ts'
      - 'bot-service/eslint.config.mjs'
      - 'bot-service/.eslintrc.json'
      - 'bot-service/tsconfig.json'
      - 'bot-service/package*.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure npm for private packages
        run: npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript compilation check
        run: npm run build
