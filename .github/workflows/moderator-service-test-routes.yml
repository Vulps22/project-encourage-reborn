name: Moderator Service — Test Routes

on:
  push:
    branches: [main]
    paths:
      - 'moderator-service/src/routes/**'
      - 'moderator-service/tests/routes/**'
      - 'moderator-service/package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'moderator-service/src/routes/**'
      - 'moderator-service/tests/routes/**'
      - 'moderator-service/package*.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test-routes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moderator-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'moderator-service/package-lock.json'

      - name: Configure npm for private packages
        run: npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run route tests
        run: npm test -- tests/routes
