name: Test Database

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'database/**'
      - 'package*.json'
  workflow_dispatch:

jobs:
  fresh-install:
    name: Fresh Install Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fresh install
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
        run: npm run db:install

  migration-test:
    name: Migration Rollout/Rollback Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for pending migrations
        id: check-migrations
        run: |
          PENDING=$(find database/migrations -maxdepth 1 -name '*_rollout.sql' -type f | wc -l)
          echo "pending_count=$PENDING" >> $GITHUB_OUTPUT
          if [ "$PENDING" -gt 0 ]; then
            echo "Found $PENDING pending migration(s)"
          else
            echo "No pending migrations found"
          fi

      - name: Get main branch for comparison
        if: steps.check-migrations.outputs.pending_count != '0'
        run: git fetch origin main

      - name: Install from main branch
        if: steps.check-migrations.outputs.pending_count != '0'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
        run: |
          git checkout origin/main -- database/schemas/
          npm run db:install
          git checkout HEAD -- database/schemas/

      - name: Apply migrations (rollout)
        if: steps.check-migrations.outputs.pending_count != '0'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
        run: |
          for file in database/migrations/*_rollout.sql; do
            if [ -f "$file" ]; then
              ISSUE=$(basename "$file" | grep -oP '#\K\d+')
              echo "Applying migration #$ISSUE..."
              npm run db:rollout -- "$ISSUE"
            fi
          done

      - name: Rollback migrations
        if: steps.check-migrations.outputs.pending_count != '0'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
        run: |
          for file in $(ls -r database/migrations/*_rollout.sql 2>/dev/null); do
            if [ -f "$file" ]; then
              ISSUE=$(basename "$file" | grep -oP '#\K\d+')
              echo "Rolling back migration #$ISSUE..."
              npm run db:rollback -- "$ISSUE"
            fi
          done

  schema-sync:
    name: Schema Sync Validation
    runs-on: ubuntu-latest
    
    services:
      postgres-migrated:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: migrateddb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      postgres-fresh:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: freshdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for pending migrations
        id: check-migrations
        run: |
          PENDING=$(find database/migrations -maxdepth 1 -name '*_rollout.sql' -type f | wc -l)
          echo "pending_count=$PENDING" >> $GITHUB_OUTPUT

      - name: Get main branch for comparison
        if: steps.check-migrations.outputs.pending_count != '0'
        run: git fetch origin main

      - name: Path A - Install from main + apply migrations
        if: steps.check-migrations.outputs.pending_count != '0'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: migrateddb
        run: |
          # Install from main branch schemas
          git checkout origin/main -- database/schemas/
          npm run db:install
          git checkout HEAD -- database/schemas/
          
          # Apply pending migrations
          for file in database/migrations/*_rollout.sql; do
            if [ -f "$file" ]; then
              ISSUE=$(basename "$file" | grep -oP '#\K\d+')
              echo "Applying migration #$ISSUE..."
              npm run db:rollout -- "$ISSUE"
            fi
          done

      - name: Path B - Fresh install from branch
        if: steps.check-migrations.outputs.pending_count != '0'
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: freshdb
        run: npm run db:install

      - name: Dump and compare schemas
        if: steps.check-migrations.outputs.pending_count != '0'
        run: |
          # Dump migrated schema
          PGPASSWORD=testpass pg_dump -h localhost -p 5432 -U testuser -d migrateddb --schema-only --no-owner --no-privileges > /tmp/migrated_schema.sql
          
          # Dump fresh schema
          PGPASSWORD=testpass pg_dump -h localhost -p 5433 -U testuser -d freshdb --schema-only --no-owner --no-privileges > /tmp/fresh_schema.sql
          
          # Compare schemas
          if diff -q /tmp/migrated_schema.sql /tmp/fresh_schema.sql > /dev/null; then
            echo "✓ Schema sync validation passed - schemas are identical"
          else
            echo "✗ Schema sync validation failed - schemas differ!"
            echo "Differences:"
            diff /tmp/migrated_schema.sql /tmp/fresh_schema.sql || true
            exit 1
          fi

      - name: Fresh install test (when no migrations)
        if: steps.check-migrations.outputs.pending_count == '0'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: migrateddb
        run: npm run db:install
