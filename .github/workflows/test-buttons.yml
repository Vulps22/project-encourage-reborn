name: Test Buttons

on:
  push:
    branches: [main]
    paths:
      - 'src/buttons/**'
      - 'src/structures/**'
      - 'package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/buttons/**'
      - 'src/structures/**'
      - 'package*.json'
  workflow_dispatch:

jobs:
  test-buttons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run button tests
        run: npm test -- src/buttons
