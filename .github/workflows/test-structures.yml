name: Test Structures

on:
  push:
    branches: [main]
    paths:
      - 'src/structures/**'
      - 'package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/structures/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-structures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run structure tests
        run: npm test -- src/structures
