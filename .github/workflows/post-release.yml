name: Post Release

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  issues: write

jobs:
  close-issues:
    name: Close In-Freeze Issues
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Close in-freeze issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while read -r NUMBER; do
            gh issue close "$NUMBER" --repo ${{ github.repository }}
            echo "Closed issue #${NUMBER}"
          done < <(gh issue list \
            --repo ${{ github.repository }} \
            --label "in-freeze" \
            --json number \
            --jq '.[].number')
