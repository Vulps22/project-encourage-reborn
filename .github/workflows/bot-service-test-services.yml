name: Bot Service — Test Services

on:
  push:
    branches: [main]
    paths:
      - 'bot-service/src/services/**'
      - 'bot-service/src/models/**'
      - 'bot-service/package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'bot-service/src/services/**'
      - 'bot-service/src/models/**'
      - 'bot-service/package*.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test-services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'bot-service/package-lock.json'

      - name: Configure npm for private packages
        run: npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run service tests
        run: npm test -- src/services
