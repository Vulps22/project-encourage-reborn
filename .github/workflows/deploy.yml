name: Deploy

on:
  workflow_run:
    workflows: ["Rollout"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.workflow_run.head_branch == 'staging' && 'Staging' || 'Production' }}
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: ${{ github.event.workflow_run.head_branch == 'staging' && 'staging' || 'production' }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.VPS_HOST }} "
            cd ${{ github.event.workflow_run.head_branch == 'staging' && '/opt/discord-bots/project-encourage-reborn' || '/opt/discord-bots/project-encourage' }} &&
            docker compose pull bot &&
            docker compose up -d bot
          "
