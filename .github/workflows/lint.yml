name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'eslint.config.mjs'
      - '.eslintrc.json'
      - 'tsconfig.json'
      - 'package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'eslint.config.mjs'
      - '.eslintrc.json'
      - 'tsconfig.json'
      - 'package*.json'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript compilation check
        run: npm run build
